# Compila FreedomPlayer en cada push a main: pruebas, APK de Android (que además se abre en un
# emulador) y app de Windows.
# Los resultados quedan como artefactos descargables en la página de cada ejecución (Actions).
# Al subir una etiqueta vX.Y.Z se compila esa versión y se publica en Releases
# (como pre-release si es v0.* o lleva guion, p. ej. v1.0.0-beta.1).
# También se puede publicar sin subir la etiqueta: Actions › Compilar › «Run workflow» con
# «version» (p. ej. 0.4.0). Entonces la etiqueta vX.Y.Z la crea la release, en el commit compilado.
name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Publicar como versión (X.Y.Z, p. ej. 0.4.0). Vacío = solo compilar.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Una etiqueta nunca se cancela a medias; un push nuevo a main sí cancela el anterior.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.version == '' }}

# bash en todos los sistemas (en Windows, el de Git), con «pipefail» para que «| tee» no oculte
# un fallo de Gradle.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Pruebas (lógica e interfaz)
        run: ./gradlew -Pfp.android=false :shared:desktopTest 2>&1 | tee build.log

      - name: Errores
        if: failure()
        run: bash .github/scripts/errores.sh build.log

      - name: Resumen de las pruebas
        if: always()
        run: python3 .github/scripts/resumen-pruebas.py shared/build/test-results/desktopTest

      - name: Guardar el informe de pruebas
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: informe-pruebas
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  # YouTube, LRCLIB y Spotify de verdad: buscar, sacar el audio, pedir una letra y leer una
  # playlist pública de Spotify. Solo avisa: YouTube a veces bloquea los servidores de GitHub, y
  # eso no debe parar una compilación.
  red:
    name: YouTube, LRCLIB y Spotify (solo aviso)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Buscar, escuchar, letras y Spotify
        run: ./gradlew -Pfp.android=false :shared:networkSmoke 2>&1 | tee red.log

      - name: Resumen
        if: always()
        # En el título no puede haber comas: separan los campos del aviso.
        run: |
          msg="$(grep -E '^(OK|FALLO)' red.log | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
          if grep -q '^FALLO' red.log || ! grep -q '^Todo bien' red.log; then
            echo "::warning title=YouTube · LRCLIB · Spotify (desde GitHub)::$msg"
          else
            echo "::notice title=YouTube · LRCLIB · Spotify responden::$msg"
          fi

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Versión
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error title=Versión::«$INPUT_VERSION» no es X.Y.Z"
              exit 1
            fi
            version="$INPUT_VERSION"
          else
            version="0.5.${GITHUB_RUN_NUMBER}"
          fi
          echo "FP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Versión: $version"

      # Sin secretos se firma con la clave de depuración estándar de Android. Esa clave la crea
      # Android la primera vez en cada máquina, así que se guarda en la caché de Actions para que
      # todas las compilaciones lleven la misma y se puedan instalar unas encima de otras.
      - name: Clave de depuración compartida entre compilaciones
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # Con los secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD se firma con
      # la clave de publicación. La clave solo existe en la carpeta temporal del runner.
      - name: Clave de publicación (si está en los secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "FP_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Se firma con la clave de publicación (secretos del repositorio)."
          elif [[ "$GITHUB_REF" == refs/tags/v* || -n "$INPUT_VERSION" ]]; then
            # Una versión publicada nunca va con la clave de depuración: Play Protect la trata
            # como sospechosa y la app no podría actualizarse encima con otra clave.
            echo "::error title=Firma::Para publicar una versión hacen falta los secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD y KEY_ALIAS (ver README › Firma del APK)."
            exit 1
          else
            echo "No hay KEYSTORE_BASE64: se firma con la clave de depuración estándar (solo compilaciones de prueba)."
          fi

      - name: Compilar el APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:assembleReleaseAndroidTest 2>&1 | tee build.log

      - name: Errores
        if: failure()
        run: bash .github/scripts/errores.sh build.log

      - name: Comprobar la firma
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$apksigner" verify --print-certs "$apk" | tee firma.txt
          # El certificado con el que se ha firmado, en el resumen de la ejecución.
          echo "::notice title=Firma del APK::$(grep -m 1 'certificate DN' firma.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* || -n "$INPUT_VERSION" ]] && grep -q 'CN=Android Debug' firma.txt; then
            echo "::error title=Firma::El APK de una versión publicada no puede ir con la clave de depuración."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/FreedomPlayer-${FP_VERSION}-android.apk"

      - name: Borrar la clave de publicación
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v6
        with:
          name: FreedomPlayer-android
          path: dist/*.apk
          if-no-files-found: error

      # Las pruebas del emulador (no se publican: solo sirven para el job «emulator»).
      - uses: actions/upload-artifact@v6
        with:
          name: pruebas-android
          path: androidApp/build/outputs/apk/androidTest/release/*.apk
          if-no-files-found: error

  # Instala el APK en un emulador de Android, abre la app y comprueba que no se cierra (ni al
  # abrirla ni al girar la pantalla) y que el logcat no tiene errores fatales. Después, las
  # pruebas de androidTest: el audio de verdad, la sesión de Media3 y la notificación.
  emulator:
    name: Android (abrir en un emulador)
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v8
        with:
          name: FreedomPlayer-android
          path: apk

      - uses: actions/download-artifact@v8
        with:
          name: pruebas-android
          path: pruebas

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir la app en el emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            bash .github/scripts/probar-apk.sh "$(ls apk/*.apk | head -n 1)"
            bash .github/scripts/pruebas-android.sh "$(ls pruebas/*.apk | head -n 1)"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulador
          path: |
            captura-emulador.png
            logcat.txt
            pruebas-android.txt
            logcat-pruebas.txt
          if-no-files-found: ignore

  # Las pantallas principales pintadas con los datos de ejemplo (móvil 390×844 y PC 1280×800),
  # para compararlas con el diseño. Solo en main: se suben a la rama «capturas-ci», que siempre
  # tiene un único commit (se reescribe en cada ejecución).
  capturas:
    name: Capturas de pantalla
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # --rerun: si el código no ha cambiado, Gradle sacaría las pruebas de la caché sin pintar nada.
      - name: Pintar las pantallas
        env:
          FP_CAPTURAS: ${{ github.workspace }}/capturas-ci
        run: ./gradlew -Pfp.android=false :shared:desktopTest --tests 'com.freedomplayer.ui.CapturasTest' --rerun 2>&1 | tee build.log

      - name: Errores
        if: failure()
        run: bash .github/scripts/errores.sh build.log

      - name: Subir a la rama capturas-ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls capturas-ci/*.png > /dev/null 2>&1; then
            echo "::error title=Capturas::No se ha pintado ninguna captura."
            exit 1
          fi
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          cd capturas-ci
          git init -q -b capturas-ci
          git add -- *.png
          printf 'Capturas de %s\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01WcmvNnWrLsfS36Z8hS6DbJ\n' "${GITHUB_SHA::7}" > "$RUNNER_TEMP/mensaje.txt"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F "$RUNNER_TEMP/mensaje.txt"
          git -c "http.https://github.com/.extraheader=$header" push -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/capturas-ci
          echo "::notice title=Capturas::$(ls *.png | wc -l) capturas en la rama capturas-ci (de ${GITHUB_SHA::7})."

  windows:
    name: Windows (instalador y portable)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Versión
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error title=Versión::«$INPUT_VERSION» no es X.Y.Z"
              exit 1
            fi
            version="$INPUT_VERSION"
          else
            version="0.5.${GITHUB_RUN_NUMBER}"
          fi
          echo "FP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Versión: $version"

      - name: Compilar el instalador (.msi) y la versión portable
        run: ./gradlew -Pfp.android=false :desktopApp:packageMsi :desktopApp:createDistributable 2>&1 | tee build.log

      - name: Errores
        if: failure()
        run: bash .github/scripts/errores.sh build.log

      - name: Preparar los archivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName "dist/FreedomPlayer-$env:FP_VERSION-windows.msi"
          Compress-Archive -Path desktopApp/build/compose/binaries/main/app/FreedomPlayer -DestinationPath "dist/FreedomPlayer-$env:FP_VERSION-windows-portable.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v6
        with:
          name: FreedomPlayer-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publicar la versión
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [test, android, emulator, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: FreedomPlayer-*
          merge-multiple: true

      - name: Crear la release con el APK y la app de Windows
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Etiqueta subida: se usa tal cual. Lanzado a mano con «version»: la crea la release
          # en el commit compilado (la versión ya se validó en los jobs de compilación).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            tag_flags=(--verify-tag)
          else
            TAG="v$INPUT_VERSION"
            tag_flags=(--target "$GITHUB_SHA")
          fi
          ls -la dist
          notes="docs/versiones/${TAG}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notas.md"
            echo "FreedomPlayer ${TAG}. Descarga el APK para Android o el instalador de Windows." > "$notes"
          fi
          flags=()
          case "$TAG" in
            v0.*|*-*) flags+=(--prerelease) ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # La release ya existe (p. ej. al repetir la ejecución): se reemplazan los archivos.
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${tag_flags[@]}" \
              --title "${TAG}" --notes-file "$notes" "${flags[@]}"
          fi
