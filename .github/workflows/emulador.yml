# Prueba a mano: compila el APK, lo instala en un emulador de Android, abre la app y comprueba que
# no se cierra (ni al abrirla ni al girar la pantalla). No va en cada push porque el emulador tarda.
# Se lanza desde Actions › «Probar en el emulador» › Run workflow.
name: Probar en el emulador

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Versión de Android (nivel de API)
        default: '34'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  emulator:
    name: Abrir el APK en un emulador
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar el APK
        run: ./gradlew :androidApp:assembleRelease 2>&1 | tee build.log

      - name: Errores
        if: failure()
        run: bash .github/scripts/errores.sh build.log

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash .github/scripts/probar-apk.sh "$(ls androidApp/build/outputs/apk/release/*.apk | head -n 1)"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulador
          path: |
            captura-emulador.png
            logcat.txt
          if-no-files-found: ignore
